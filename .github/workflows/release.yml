name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name GLSketchStudio --paths src
          src/glsketch/__main__.py
      - shell: pwsh
        run: tar.exe -a -c -f dist/GLSketchStudio-Windows-x64.zip -C dist/GLSketchStudio .
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/GLSketchStudio-Windows-x64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
